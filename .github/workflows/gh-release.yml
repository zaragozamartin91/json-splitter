name: gh-release

on:
  workflow_dispatch: # Allows you to trigger the release manually from the UI
    inputs:
      versionScheme:
        description: 'Version id'
        required: true
        type: string
        default: 'foobar'

env:
  MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: allows the bot to push commits and tags
    
    steps:
      # Checking out the code using GH_ACTION_DEPLOY_KEY allows the bot to push commits
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.GH_ACTION_DEPLOY_KEY }}

      # Not specifying a settings.xml file defaulst to ~/.m2/settings.xml which holds:
      # <servers>
      #   <server>
      #     <id>github</id>
      #     <username>${env.GITHUB_ACTOR}</username>
      #     <password>${env.GITHUB_TOKEN}</password>
      #   </server>
      # </servers>
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE


#      - name: Configure git
#        run: |
#          git config --local user.email "github-actions@github.com"
#          git config --local user.name "GitHub Actions"

      - name: GH release
        run: gh release create "v${VERSION}" --generate-notes --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.release_version }}
